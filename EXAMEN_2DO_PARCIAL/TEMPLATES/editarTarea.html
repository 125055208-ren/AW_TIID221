<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Tarea</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>
<body class="bg-light">

    <nav class="navbar navbar-dark bg-primary mb-4 shadow-sm">
        <div class="container">
            <span class="navbar-brand mb-0 h1"><i class="bi bi-check2-square me-2"></i>GESTIÓN DE TAREAS</span>
        </div>
    </nav>

    <div class="container" style="max-width: 720px;">
        <div class="card shadow-sm">
            <div class="card-header bg-white fw-semibold">Tarea a editar</div>
            <div class="card-body">
                <form action="/actualizar/{{ Tarea.0 }}" method="POST" class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label" for="txtTitulo">Título</label>
                        <input type="text" class="form-control" id="txtTitulo" name="txtTitulo" value="{{ Tarea.1 }}" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label" for="txtFecha">Fecha límite</label>
                        <input type="date" class="form-control" id="txtFecha" name="txtFecha" value="{{ Tarea.3 }}" required>
                    </div>
                    <div class="col-12">
                        <label class="form-label" for="txtDescripcion">Descripción</label>
                        <textarea class="form-control" id="txtDescripcion" name="txtDescripcion" rows="3" required>{{ Tarea.2 }}</textarea>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label" for="selPrioridad">Prioridad</label>
                        <select class="form-select" id="selPrioridad" name="selPrioridad" required>
                            <option value="baja" {% if Tarea.4 == 'baja' %}selected{% endif %}>Baja</option>
                            <option value="media" {% if Tarea.4 == 'media' %}selected{% endif %}>Media</option>
                            <option value="alta" {% if Tarea.4 == 'alta' %}selected{% endif %}>Alta</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label" for="selEstado">Estado</label>
                        <select class="form-select" id="selEstado" name="selEstado" required>
                            <option value="pendiente" {% if Tarea.5 == 'pendiente' %}selected{% endif %}>Pendiente</option>
                            <option value="completado" {% if Tarea.5 == 'completado' %}selected{% endif %}>Completado</option>
                        </select>
                    </div>
                    <div class="col-12 d-flex gap-2">
                        <button type="submit" class="btn btn-primary"><i class="bi bi-arrow-repeat me-1"></i>Actualizar</button>
                        <a href="{{ url_for('index') }}" class="btn btn-outline-secondary">Regresar</a>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
