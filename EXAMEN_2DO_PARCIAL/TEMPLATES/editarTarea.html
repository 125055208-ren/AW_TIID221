<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Tarea</title>
</head>
<body>

    <div>
        <h1>Tarea DE editar</h1>
        <form action="/actualizar/{{ Tarea.0 }}" method="POST">
            <input type="text" name="txtTitulo" value="{{ Tarea.1 }}" required>
            <input type="text" name="txtDescripcion" value="{{ Tarea.2 }}" required>
            <select name="selPrioridad" required>
                <option value="baja" {% if Tarea.3 == 'baja' %}selected{% endif %}>Baja</option>
                <option value="media" {% if Tarea.3 == 'media' %}selected{% endif %}>Media</option>
                <option value="alta" {% if Tarea.3 == 'alta' %}selected{% endif %}>Alta</option>
            </select>
            <select name="selEstado" required>
                <option value="pendiente" {% if Tarea.4 == 'pendiente' %}selected{% endif %}>Pendiente</option>
                <option value="completado" {% if Tarea.4 == 'completado' %}selected{% endif %}>Completado</option>
            </select>
            <button type="submit">Actualizar</button>
        </form>
    </div>

</body>
</html>
