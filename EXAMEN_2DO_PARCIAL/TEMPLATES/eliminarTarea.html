<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eliminar Tarea</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>
<body class="bg-light">

    <nav class="navbar navbar-dark bg-primary mb-4 shadow-sm">
        <div class="container">
            <span class="navbar-brand mb-0 h1"><i class="bi bi-check2-square me-2"></i>GESTIÓN DE TAREAS</span>
        </div>
    </nav>

    <div class="container" style="max-width: 720px;">
        <div class="card shadow-sm border-danger">
            <div class="card-header bg-danger text-white fw-semibold">Tarea a eliminar</div>
            <div class="card-body">
                <form action="/eliminar/{{ Tarea.0 }}" method="POST" class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label" for="txtTitulo">Título</label>
                        <input type="text" class="form-control" id="txtTitulo" name="txtTitulo" value="{{ Tarea.1 }}" readonly>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Fecha límite</label>
                        <input type="date" class="form-control" value="{{ Tarea.3 }}" disabled>
                    </div>
                    <div class="col-12">
                        <label class="form-label">Descripción</label>
                        <textarea class="form-control" rows="3" disabled>{{ Tarea.2 }}</textarea>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Prioridad</label>
                        <input type="text" class="form-control" value="{{ Tarea.4|capitalize }}" disabled>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Estado</label>
                        <input type="text" class="form-control" value="{{ Tarea.5|capitalize }}" disabled>
                    </div>
                    <div class="col-12 d-flex gap-2">
                        <button type="submit" class="btn btn-danger" onclick="return Eliminar()"><i class="bi bi-trash me-1"></i>Eliminar</button>
                        <button type="button" class="btn btn-outline-secondary" onclick="Regresar()">Regresar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        function Eliminar() {
            return confirm("¿Estás seguro de que deseas eliminar esta tarea?");
        }
        function Regresar() {
            window.location.href = "{{ url_for('index') }}";
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
